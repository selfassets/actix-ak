[workspace]
members = [".", "registry-server"]
resolver = "2"

[package]
name = "actix-ak"
version = "0.1.0"
edition = "2021"

[features]
default = []
swagger = ["utoipa", "utoipa-swagger-ui"]

[dependencies]
# Swagger / OpenAPI 文档（开发模式可选）
utoipa = { version = "5", features = ["actix_extras", "chrono"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["actix-web"], optional = true }
actix-web = "4.4"
awc = "3"
actix-cors = "0.7"
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip", "cookies"] }
url = "2.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
encoding_rs = "0.8"  # GB2312编码解析
scraper = "0.18"  # HTML解析
calamine = "0.24"  # Excel文件解析
zip = "0.6"  # ZIP文件解析
futures = "0.3"  # 异步工具